name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  AWS_REGION: us-east-1

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black mypy "httpx==0.23.3"

      - name: Run flake8 linting
        run: flake8 app/ --max-line-length=120 --ignore=E501,W503,F401,F841,E741

      - name: Run black formatting check
        run: black --check app/

      - name: Run mypy type check
        run: mypy app/ --ignore-missing-imports || true

      - name: Run tests
        run: python -m pytest tests/ -v --cov=app --cov-report=xml
        env:
          AWS_DEFAULT_REGION: ap-south-1
          DYNAMODB_USERS_TABLE: test-users
          DYNAMODB_COURSES_TABLE: test-courses
          DYNAMODB_TIERS_TABLE: test-tiers
          DYNAMODB_ENROLLMENTS_TABLE: test-enrollments
          DYNAMODB_LESSONS_TABLE: test-lessons
          DYNAMODB_PROGRESS_TABLE: test-progress
          DYNAMODB_LEADS_TABLE: test-leads
          DYNAMODB_MENTORSHIP_TABLE: test-mentorship
          DYNAMODB_MODULES_TABLE: test-modules
          COGNITO_USER_POOL_ID: test-pool
          COGNITO_CLIENT_ID: test-client
          S3_VIDEO_BUCKET: test-videos
          S3_DOCUMENTS_BUCKET: test-docs
          RAZORPAY_KEY_ID: test-key
          RAZORPAY_KEY_SECRET: test-secret

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  package:
    name: Package Lambda
    needs: lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create Lambda layer
        run: |
          mkdir -p layer/python
          pip install -r requirements.txt -t layer/python/
          cd layer && zip -r ../lambda-layer.zip python/

      - name: Create Lambda package
        run: |
          cd app && zip -r ../lambda-function.zip . -x "__pycache__/*" "*.pyc"

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: |
            backend/lambda-function.zip
            backend/lambda-layer.zip
          retention-days: 7

  # =============================================
  # Deploy to Dev (develop branch only)
  # =============================================
  deploy-dev:
    name: Deploy to Dev
    needs: package
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: packages/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Lambda layer
        run: |
          LAYER_ARN=$(aws lambda publish-layer-version \
            --layer-name dev-finops-dependencies \
            --zip-file fileb://packages/lambda-layer.zip \
            --compatible-runtimes python3.11 \
            --query 'LayerVersionArn' --output text)
          echo "LAYER_ARN=$LAYER_ARN" >> $GITHUB_ENV

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name dev-finops-backend \
            --zip-file fileb://packages/lambda-function.zip

          aws lambda wait function-updated \
            --function-name dev-finops-backend

          aws lambda update-function-configuration \
            --function-name dev-finops-backend \
            --layers ${{ env.LAYER_ARN }}

      - name: Verify deployment
        run: |
          echo '{"httpMethod":"GET","path":"/health"}' > payload.json
          aws lambda invoke \
            --function-name dev-finops-backend \
            --payload fileb://payload.json \
            response.json
          cat response.json

  # =============================================
  # Deploy to Prod (main branch only)
  # =============================================
  deploy-prod:
    name: Deploy to Production
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: packages/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Lambda layer
        run: |
          LAYER_ARN=$(aws lambda publish-layer-version \
            --layer-name finops-saas-prod-dependencies \
            --zip-file fileb://packages/lambda-layer.zip \
            --compatible-runtimes python3.11 \
            --query 'LayerVersionArn' --output text)
          echo "LAYER_ARN=$LAYER_ARN" >> $GITHUB_ENV

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name finops-saas-prod-api \
            --zip-file fileb://packages/lambda-function.zip

          aws lambda wait function-updated \
            --function-name finops-saas-prod-api

          aws lambda update-function-configuration \
            --function-name finops-saas-prod-api \
            --layers ${{ env.LAYER_ARN }}

      - name: Verify deployment
        run: |
          echo '{"httpMethod":"GET","path":"/health"}' > payload.json
          aws lambda invoke \
            --function-name finops-saas-prod-api \
            --payload fileb://payload.json \
            response.json
          cat response.json
